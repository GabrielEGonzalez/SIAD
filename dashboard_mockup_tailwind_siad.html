<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard SIAD Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans">

<div class="flex h-screen">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-slate-900 text-white flex flex-col">
    <div class="p-5 text-xl font-bold border-b border-slate-700">
      SIAD
    </div>

    <nav class="flex-1 p-4 space-y-2">
      <p class="text-xs text-slate-400 uppercase">General</p>

      <a href="#" class="flex items-center gap-3 p-3 rounded-lg bg-slate-800">
        <i class="bi bi-grid"></i> Dashboard
      </a>

      <a href="#" class="flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition">
        <i class="bi bi-people"></i> Casos
      </a>

      <p class="text-xs text-slate-400 uppercase mt-4">Gestión</p>

      <a href="#" class="flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition">
        <i class="bi bi-file-earmark-plus"></i> Registrar
      </a>

      <a href="#" class="flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition">
        <i class="bi bi-bar-chart"></i> Reportes
      </a>

      <a href="#" class="flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition">
        <i class="bi bi-calendar"></i> Citas
      </a>
    </nav>

    <div class="p-4 border-t border-slate-700">
      <button class="w-full bg-red-500 hover:bg-red-600 p-2 rounded-lg">Salir</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col">

    <!-- TOPBAR -->
    <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
      <h1 class="text-xl font-semibold">Panel Administrador</h1>

      <div class="flex items-center gap-4">
        <div class="bg-slate-200 w-10 h-10 rounded-full flex items-center justify-center">
          G
        </div>
        <span class="font-medium">Gabi</span>
      </div>
    </header>

    <!-- CONTENT -->
    <div class="p-6 space-y-6 overflow-y-auto">

      <!-- STATS -->
      <div class="grid grid-cols-3 gap-6">
        <div class="bg-white p-5 rounded-xl shadow hover:shadow-lg transition">
          <p class="text-slate-500">Casos Totales</p>
          <h2 class="text-2xl font-bold">120</h2>
        </div>

        <div class="bg-white p-5 rounded-xl shadow hover:shadow-lg transition">
          <p class="text-slate-500">En Seguimiento</p>
          <h2 class="text-2xl font-bold">45</h2>
        </div>

        <div class="bg-white p-5 rounded-xl shadow hover:shadow-lg transition">
          <p class="text-slate-500">Citas Hoy</p>
          <h2 class="text-2xl font-bold">8</h2>
        </div>
      </div>

      <!-- CALENDAR MOCK -->
      <div class="bg-white p-6 rounded-xl shadow">
        <h2 class="text-lg font-semibold mb-4">Calendario</h2>
        <div class="h-64 flex items-center justify-center text-slate-400">
          (Aquí va FullCalendar)
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="flex gap-4">
        <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Nuevo Caso</button>
        <button class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">Ver Citas</button>
        <button class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Generar Reporte</button>
      </div>

    </div>

  </main>
</div>

</body>
</html>
